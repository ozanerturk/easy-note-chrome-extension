<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Easy Note</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="canvas">
      <div id="world"></div>
      <div id="hint">Double-click anywhere to add a note</div>
    </div>

    <div id="overlay"></div>

    <div id="controls">
      <button id="toggle-dates" title="Show last edited time">🕘</button>
      <span class="sep"></span>
      <button id="zoom-out" title="Zoom out">−</button>
      <button id="zoom-level" title="Reset to 100%">100%</button>
      <button id="zoom-in" title="Zoom in">+</button>
      <span class="sep"></span>
      <button id="fit" title="Fit all notes in view">Fit</button>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
